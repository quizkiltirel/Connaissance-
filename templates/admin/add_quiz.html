```html
{% extends "quiz_betting/base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-3xl mx-auto">
        <div class="bg-white rounded-3xl shadow-2xl p-8">
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h1 class="text-3xl font-black mb-2">➕ Ajoute Nouvo Quiz</h1>
                    <p class="text-gray-600">Kreye yon nouvo kesyon pou itilizatè yo</p>
                </div>
                <a href="{{ url_for('admin_quiz_list') }}" class="text-gray-600 hover:text-gray-800 font-semibold">
                    ← Retounen
                </a>
            </div>

            <form method="POST" class="space-y-6">
                <!-- Category -->
                <div>
                    <label class="block text-sm font-bold mb-2">Kategori</label>
                    <select name="category" required class="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-purple-500 focus:outline-none">
                        <option value="Futbòl">Futbòl</option>
                        <option value="Istwa">Istwa</option>
                        <option value="Estatistik">Estatistik</option>
                        <option value="Règ">Règ</option>
                    </select>
                </div>

                <!-- Difficulty -->
                <div>
                    <label class="block text-sm font-bold mb-2">Difikilte</label>
                    <select name="difficulty" required class="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-purple-500 focus:outline-none">
                        <option value="Fasil">Fasil (35-40 HTG)</option>
                        <option value="Mwayen">Mwayen (50 HTG)</option>
                        <option value="Difisil">Difisil (60 HTG)</option>
                    </select>
                </div>

                <!-- Question -->
                <div>
                    <label class="block text-sm font-bold mb-2">Kesyon</label>
                    <textarea name="question" required rows="3" 
                              class="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-purple-500 focus:outline-none"></textarea>
                </div>

                <!-- Options -->
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold mb-2">Opsyon 1</label>
                        <input type="text" name="option1" required 
                               class="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-purple-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2">Opsyon 2</label>
                        <input type="text" name="option2" required 
                               class="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-purple-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2">Opsyon 3</label>
                        <input type="text" name="option3" required 
                               class="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-purple-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2">Opsyon 4</label>
                        <input type="text" name="option4" required 
                               class="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-purple-500 focus:outline-none">
                    </div>
                </div>

                <!-- Correct Answer -->
                <div>
                    <label class="block text-sm font-bold mb-2">Repons Kòrèk</label>
                    <input type="text" name="correct_answer" required 
                           placeholder="Tape repons kòrèk la egzakteman"
                           class="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-purple-500 focus:outline-none">
                </div>

                <!-- Bet and Win Amounts -->
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold mb-2">Montan Paryaj (HTG)</label>
                        <input type="number" name="bet_amount" value="25" required 
                               class="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-purple-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2">Montan Genyen (HTG)</label>
                        <input type="number" name="win_amount" value="40" required 
                               class="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-purple-500 focus:outline-none">
                    </div>
                </div>

                <!-- Explanation -->
                <div>
                    <label class="block text-sm font-bold mb-2">Eksplikasyon</label>
                    <textarea name="explanation" required rows="3" 
                              placeholder="Eksplike repons kòrèk la..."
                              class="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-purple-500 focus:outline-none"></textarea>
                </div>

                <!-- Submit -->
                <button type="submit" class="w-full gradient-bg text-white py-4 rounded-xl font-black text-lg hover:opacity-90 transition-all">
                    ➕ Ajoute Quiz
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
```
