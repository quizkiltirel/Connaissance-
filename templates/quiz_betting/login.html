{% extends "quiz_betting/base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-16">
    <div class="max-w-md mx-auto">
        <div class="bg-white rounded-3xl shadow-2xl p-8">
            <div class="text-center mb-8">
                <div class="text-6xl mb-4">🔓</div>
                <h1 class="text-3xl font-black">Konekte</h1>
                <p class="text-gray-600">Antre nan kont ou</p>
            </div>

            {% if error %}
            <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded mb-6">
                <p>{{ error }}</p>
            </div>
            {% endif %}

            <form method="POST" class="space-y-6">
                <div>
                    <label class="block text-sm font-bold mb-2">Email</label>
                    <input type="email" name="email" required 
                           class="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-purple-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-bold mb-2">Modpas</label>
                    <input type="password" name="password" required 
                           class="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-purple-500 focus:outline-none">
                </div>

                <button type="submit" 
                        class="w-full gradient-bg text-white py-4 rounded-xl font-black text-lg hover:opacity-90 transition-all">
                    Konekte
                </button>
            </form>

            <p class="text-center mt-6 text-gray-600">
                Ou pa gen kont? <a href="{{ url_for('signup') }}" class="text-purple-600 font-bold hover:underline">Enskri</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
